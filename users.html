<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Users Management - Shop Management System</title>
    <link rel="stylesheet" href="css/style.css?v=14">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .users-filter-section {
            padding: 12px 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .users-filter-section .search-box { margin-bottom: 10px; }
        .users-filter-section .filter-options { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .users-filter-section .filter-options select { flex: 1; min-width: 100px; }

        @media (max-width: 768px) {
            .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
            .stats-grid .stat-card { padding: 12px; }
            .stats-grid .stat-card .stat-icon { width: 36px; height: 36px; font-size: 0.9rem; }
            .stats-grid .stat-card .stat-info h3 { font-size: 0.7rem; }
            .stats-grid .stat-card .stat-info .value { font-size: 1.1rem; }
            .content { padding: 10px !important; }
            .users-filter-section { padding: 10px; }
            .users-filter-section .search-box input { width: 100%; font-size: 0.85rem; }
            .users-filter-section .filter-options select { min-width: 0; font-size: 0.8rem; padding: 8px 6px; }
            .table-container { overflow-x: auto; }
            .table-container table { min-width: 650px; font-size: 0.75rem; }
            .table-container table th, .table-container table td { padding: 8px 6px; white-space: nowrap; }
            .navbar-right .btn { font-size: 0.7rem; padding: 6px 8px; }
        }
    </style>
</head>

<body class="users-page">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-store"></i> <span id="shopNameHeader">Shop Name</span></h2>
            <div class="user-info">
                <div class="user-name" id="userName">Loading...</div>
                <div class="user-role" id="sidebarUserRole">Shop Admin</div>
            </div>
        </div>

        <ul class="nav-links">
            <!-- Menu items will be loaded dynamically by MenuManager -->
        </ul>
    </aside>

    <main class="main-content">
        <nav class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h3>Users</h3>
            </div>
            <div class="navbar-right">
                <button class="btn btn-primary btn-action" id="addUserBtn" data-tip="Add User">
                    <i class="fas fa-user-plus"></i> Add<span class="hide-mobile-text"> User</span>
                </button>
                <button class="btn btn-success btn-action" id="exportUsersBtn" data-tip="Export Users">
                    <i class="fas fa-file-excel"></i> Export<span class="hide-mobile-text"> Excel</span>
                </button>
            </div>
        </nav>

        <div class="content">
            <!-- Users Statistics -->
            <div class="users-stats">
                <div class="stat-card">
                    <div class="stat-icon danger">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Total Users</h3>
                        <div class="value" id="totalUsers">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon success">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Active Admins</h3>
                        <div class="value" id="activeAdmins">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon info">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Active Staff</h3>
                        <div class="value" id="activeStaff">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon warning">
                        <i class="fas fa-user-clock"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Inactive Users</h3>
                        <div class="value" id="inactiveUsers">0</div>
                    </div>
                </div>
            </div>

            <!-- Users Table -->
            <!-- Search & Filters (separate from table for mobile) -->
            <div class="users-filter-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="usersSearch" placeholder="Search users...">
                </div>

                <div class="filter-options">
                    <select id="usersRoleFilter" class="form-control">
                        <option value="">All Roles</option>
                        <option value="shop_admin">Shop Admin</option>
                        <option value="shop_staff">Shop Staff</option>
                    </select>

                    <select id="usersStatusFilter" class="form-control">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>

                    <button class="btn btn-secondary" id="refreshUsers">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Users Table (scrolls independently) -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Role</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Last Login</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr>
                            <td colspan="9" class="text-center">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add/Edit User Modal -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-user-edit"></i> <span id="userModalTitle">Add User</span></h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <input type="hidden" id="userId">

                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Username *</label>
                            <input type="text" id="username" required>
                        </div>

                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Password *</label>
                            <div style="position:relative;display:flex;gap:6px;">
                                <div style="position:relative;flex:1;">
                                    <input type="password" id="password" required style="width:100%;padding-right:36px;">
                                    <button type="button" id="togglePasswordBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748b;font-size:1rem;padding:4px;" title="Show/Hide password">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <button type="button" class="btn btn-sm" id="generatePassword" title="Generate random password">Generate</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-id-card"></i> Full Name *</label>
                            <input type="text" id="fullName" required>
                        </div>

                        <div class="form-group">
                            <label><i class="fas fa-phone"></i> Phone Number</label>
                            <input type="tel" id="userPhone">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" id="userEmail">
                        </div>

                        <div class="form-group">
                            <label><i class="fas fa-user-tag"></i> Role *</label>
                            <select id="userRole" required>
                                <option value="">Select Role</option>
                                <option value="shop_admin">Shop Admin</option>
                                <option value="shop_staff">Shop Staff</option>
                            </select>
                        </div>
                    </div>

                    <!-- Permissions Section -->
                    <div class="permissions-section">
                        <h5><i class="fas fa-key"></i> Permissions</h5>

                        <div class="permissions-grid">
                            <div class="form-check">
                                <input type="checkbox" id="permDashboard">
                                <label for="permDashboard">Dashboard</label>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="permPOS" checked>
                                <label for="permPOS">POS</label>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="permInventory" checked>
                                <label for="permInventory">Inventory</label>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="permSales">
                                <label for="permSales">Sales Report</label>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="permCredit" checked>
                                <label for="permCredit">Credit</label>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="permExpenses">
                                <label for="permExpenses">Expenses</label>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="permUsers">
                                <label for="permUsers">Users Management</label>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="permSettings">
                                <label for="permSettings">Settings</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="form-check">
                            <input type="checkbox" id="userActive" checked>
                            <label for="userActive" class="form-check-label">
                                <i class="fas fa-check-circle"></i> Account Active
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-action close-modal" data-tip="Cancel"><i class="fas fa-times"></i> Cancel</button>
                <button class="btn btn-danger" id="deleteUserBtn" data-tip="Delete User" style="display: none;">
                    <i class="fas fa-trash"></i> Delete
                </button>
                <button class="btn btn-primary btn-action" id="saveUserBtn" data-tip="Save User">
                    <i class="fas fa-save"></i> Save User
                </button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/menu-manager.js"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/users.js"></script>
</body>

</html>
